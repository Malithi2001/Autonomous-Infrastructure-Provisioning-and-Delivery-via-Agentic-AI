name: CD — Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        id: deploy-config
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0

          if [ -z "$AWS_REGION" ]; then
            echo "::notice::AWS region is missing. Set repository variable AWS_REGION or secret AWS_REGION/AWS_DEFAULT_REGION to enable deployment."
            missing=1
          fi

          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::notice::AWS credentials are missing. Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets to enable deployment."
            missing=1
          fi

          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::notice::EC2 SSH deployment secrets are missing. Set EC2_HOST, EC2_USER, and EC2_SSH_KEY to enable deployment."
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deployment skipped"
              echo ""
              echo "AWS/EC2 deployment secrets are not configured for this repository."
              echo "The workflow stays successful so CI can pass; configure the secrets only when real deployment is required."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "deploy_ready=true" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.deploy-config.outputs.deploy_ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.deploy-config.outputs.deploy_ready == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image
        if: steps.deploy-config.outputs.deploy_ready == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/devops-assistant-backend:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/devops-assistant-backend:$IMAGE_TAG

      - name: Build, tag, and push frontend image
        if: steps.deploy-config.outputs.deploy_ready == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/devops-assistant-frontend:$IMAGE_TAG ./frontend
          docker push $ECR_REGISTRY/devops-assistant-frontend:$IMAGE_TAG

      - name: Deploy to EC2 via SSH
        if: steps.deploy-config.outputs.deploy_ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/devops-assistant
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f

      - name: Skip deployment
        if: steps.deploy-config.outputs.deploy_ready != 'true'
        run: echo "Deployment skipped because AWS/EC2 secrets are not configured."
