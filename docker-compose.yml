version: "3.9"

# ============================================================
# DevOps Assistant — Docker Compose
# Services: backend · frontend · db · redis · worker · flower
# ============================================================

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://devops_user:devops_pass@db:5432/devops_assistant}
  REDIS_URL: redis://redis:6379/0

services:

  # ── Database ────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: devops_assistant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops_pass}
      POSTGRES_DB: ${POSTGRES_DB:-devops_assistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devops_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devops_net

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: devops_assistant_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devops_net

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops_assistant_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Docker tool integration
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - devops_net

  # ── Celery Worker ───────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops_assistant_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devops_net

  # ── Celery Flower (task monitoring UI) ─────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops_assistant_flower
    restart: unless-stopped
    command: celery -A app.core.celery_app flower --port=5555 --url-prefix=flower
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    networks:
      - devops_net

  # ── React Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: devops_assistant_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - devops_net

volumes:
  postgres_data:
  redis_data:

networks:
  devops_net:
    name: devops_assistant_network
    driver: bridge
